<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="STACKLY Security — Page Not Found"
    >

    <meta
        name="author"
        content="STACKLY Security"
    >

    <title>
        STACKLY Security — 404
    </title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =====================================================
         404 CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="css/404.css"
    >

</head>


<body>


<!-- =========================================================
     404 PAGE
========================================================= -->

<main class="error-page">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div
        class="error-background"
        aria-hidden="true"
    >

        <img
            src="assets/u9.webp"
            alt=""
            class="error-background-image"
        >

    </div>


    <!-- =====================================================
         BACKGROUND DECORATION
    ====================================================== -->

    <div
        class="error-grid"
        aria-hidden="true"
    ></div>


    <div
        class="error-scan-line"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         HEADER LOGO
    ====================================================== -->

    

    <!-- =====================================================
         CENTER CONTENT
    ====================================================== -->

    <section
        class="error-content"
        aria-labelledby="error-title"
    >


        <!-- EYEBROW -->

        <div class="error-eyebrow">

            <span class="error-eyebrow-line"></span>

            <span>
                SYSTEM · PAGE NOT FOUND
            </span>

        </div>


        <!-- 404 -->

        <h1
            id="error-title"
            class="error-code"
        >
            404
        </h1>


        <!-- DIVIDER -->

        <div
            class="error-divider"
            aria-hidden="true"
        ></div>


        <!-- MESSAGE -->

        <p class="error-message">

            The path may be broken,
            but the journey isn't.
            Let's get you back.

        </p>


        <!-- BACK HOME -->

        <a
            href="index.html"
            class="error-home-button"
        >

            <span>
                Back To Home
            </span>

            <i class="fa-solid fa-arrow-right"></i>

        </a>


        <!-- STATUS -->

        <div class="error-status">

            <span class="status-dot"></span>

            <span>
                SYSTEM SECURE · CONNECTION ACTIVE
            </span>

        </div>

    </section>


</main>


</body>

</html>
